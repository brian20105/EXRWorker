services:
  - type: web
    name: expertworker
    env: node
    plan: free
    buildCommand: npm install; npm run build
    startCommand: node start.cjs
    autoDeploy: true
    envVars:
      - key: DASHBOARD_URL
        value: https://expertworker.onrender.com
      - key: DISCORD_CLIENT_ID
        value: "1447870937214222347"
      - key: DISCORD_REDIRECT_URI
        value: https://expertworker.onrender.com/api/auth/discord/callback
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_AUTH_SECRET
        sync: false
      - key: RUN_BOT
        value: "false"
      - key: APP_RELEASE
        value: "2026-05-09-role-blocks-backend-refresh-2"
